services:
  db:
    image: pgvector/pgvector:pg16
    container_name: learn_ai_engineering_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learn_ai_engineering}
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learn_ai_engineering}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learn_ai_engineering_server
    restart: always
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
        - path: ./models
          action: sync
          target: /app/models
        - path: ./pipelines
          action: sync
          target: /app/pipelines
        - path: ./core
          action: sync
          target: /app/core
        - path: ./main.py
          action: sync
          target: /app/main.py
    ports:
      - "8002:8002"
    volumes:
      - .:/app

    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-learn_ai_engineering}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-learn_ai_engineering}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  redis:
    image: redis:6-alpine
    container_name: learn_ai_engineering_redis
    restart: always
    ports:
      - "6379:6379"
    # volumes:
    #   - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
